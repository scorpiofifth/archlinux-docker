name: Build and Release Docker Image

on:
  push:
    branches:
      - master
    paths:
      - 'Dockerfile'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: archlinux-for-distrobox:latest
          outputs: type=docker,dest=/tmp/archlinux-for-distrobox.tar

      - name: Compress image
        run: gzip /tmp/archlinux-for-distrobox.tar

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: /tmp/archlinux-for-distrobox.tar.gz
